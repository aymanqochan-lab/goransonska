name: Upscale new layer photos

on:
  push:
    branches: [upscale2]

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install spandrel==0.4.0 pillow numpy
          curl -sL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - name: Upscale
        run: python tools/upscale/upscale2.py
      - name: Commit
        run: |
          git config user.name "upscale-bot"
          git config user.email "upscale-bot@users.noreply.github.com"
          git checkout -b upscaled2
          git add tools/upscale/out tools/upscale/src/exploded2
          git commit -m "Upscaled new layer photos"
          git push -f origin upscaled2
